# Netlify build configuration.
#
# This file lives at the repo root while the app lives in `web/`, so `base`
# does the work: Netlify changes into that directory before installing or
# building, and `publish` is resolved relative to it rather than to the repo
# root. That last part is not what Netlify's UI implies and it cost the first
# deploy: `web/.next` here resolved to `/opt/build/repo/web/web/.next`, and
# @netlify/plugin-nextjs failed in onBuild on a publish directory that does
# not exist. `base` is repo-root-relative; everything after it is not.
#
# Everything here is deliberately also settable in the Netlify UI. It is in the
# repo because a setting that exists only in a dashboard is a setting nobody
# reviews — and one of the values below is a GDPR guarantee, not a preference.

[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 16 requires Node 20.9+. Pinned rather than inherited so a change in
  # Netlify's default image cannot move the runtime under the app silently.
  NODE_VERSION = "22"

  # SPEC.md → "The app ships from one origin": Next.js telemetry is off for the
  # same reason the fonts are self-hosted. Locally that is true because
  # `next telemetry disable` wrote to the developer's own user config — a
  # machine-local file that is not in this repo and does not exist on a build
  # container. Without this line the guarantee holds on one laptop and nowhere
  # else, starting with the first CI build.
  NEXT_TELEMETRY_DISABLED = "1"

# `/kako-rangiramo` was deleted on 2026-09-24 when ranking was removed: there is
# no ordering to explain any more, so the page had no subject. It is redirected
# rather than left to 404 because it was indexed (position 3.50) and linked from
# four pages — and on a site where 88 of 113 URLs are still waiting to be
# crawled, a 404 spends crawl budget to say nothing. `/nase-obecanje` is the
# destination because that is where the promise it carried now lives.
[[redirects]]
  from = "/kako-rangiramo"
  to = "/nase-obecanje"
  status = 301
  force = true

# The Next.js runtime. Netlify installs it automatically on detecting Next, but
# an automatic dependency is one that can stop being automatic; the app has
# server-rendered routes (`/` and the flow) and cannot be served as a static
# export, so this is load-bearing.
[[plugins]]
  package = "@netlify/plugin-nextjs"
