<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <title>Obrasci</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      Netlify's form definition, and the reason this file exists.

      Netlify discovers forms by scanning the static HTML a build produces. A
      Next.js App Router page is rendered by the runtime rather than emitted as
      a plain file the scanner reads, so a form declared only inside a React
      component is never registered and its submissions are silently dropped.
      The documented workaround is this file: a static page holding the field
      definitions, so the scanner has something to register.

      Two consequences worth knowing before editing:

      1. **This file and the form in `app/za-pogrebnike/page.tsx` must carry the
         same field names.** Netlify records only the fields declared here — a
         field added to the React form and not to this one arrives empty, with
         no error anywhere.
      2. **This file declares fields and nothing else.** Everything about a
         live submission is decided by the React form, because that is the one
         a browser actually submits: it POSTs to its own `action`, Netlify
         intercepts at the edge, matches `form-name` against the definition
         below, stores the submission, and redirects to that same `action`.
         The `action` written here is never read by anything.

         An earlier revision had this backwards — it claimed the `action` below
         was the success page and had the React form POST to `/__forms.html`.
         The first live submission landed on Netlify's generic confirmation
         page rather than on `/za-pogrebnike/hvala`, which is what corrected it.
         The two are kept identical anyway, so that reading either file alone
         does not mislead the next person.

      The submission path cannot be exercised locally: form handling is a
      Netlify build-and-runtime feature, so it is only ever verifiable against
      a deploy.
    -->
    <form
      name="pogrebnici"
      data-netlify="true"
      netlify-honeypot="bot-field"
      action="/za-pogrebnike/hvala"
      hidden
    >
      <input type="hidden" name="form-name" value="pogrebnici" />
      <input type="text" name="company" />
      <input type="text" name="oib" />
      <input type="text" name="city" />
      <input type="text" name="contact_name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="reason">
        <option value="correction"></option>
        <option value="missing"></option>
        <option value="partnership"></option>
        <option value="other"></option>
      </select>
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
